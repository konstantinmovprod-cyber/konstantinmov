<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020202">
  <title>суперы · клуб по нейросетям</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <!-- Запасные шрифты, пока в /fonts нет фирменных Soyuz Grotesk и Coolvetica -->
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <section class="screen" data-screen="onboarding" data-fullscreen></section>
    <section class="screen" data-screen="home"></section>
    <section class="screen" data-screen="path"></section>
    <section class="screen" data-screen="level"></section>
    <section class="screen" data-screen="powers"></section>
    <section class="screen" data-screen="paywall" data-fullscreen></section>
    <section class="screen" data-screen="club"></section>
    <section class="screen" data-screen="profile"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-go="home"><i class="fas fa-house"></i><span>главная</span></button>
    <button class="tab" data-go="path"><i class="fas fa-diagram-project"></i><span>путь</span></button>
    <button class="tab" data-go="club"><i class="fas fa-users"></i><span>клуб</span></button>
    <button class="tab" data-go="profile"><i class="fas fa-user"></i><span>профиль</span></button>
  </nav>

  <!-- Bottom sheet: урок / код доступа -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
